<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- Poki SDK (единственный внешний скрипт: остальные внешние запросы Poki блокирует) -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <!-- poki include head -->
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;               /* страница Poki не прокручивается из игры */
      background: #14171b;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;             /* жесты на холсте — игре, а не браузеру */
    }
    #unity-canvas {
      position: fixed; left: 0; top: 0;
      width: 100%; height: 100%;
      display: block; background: #14171b; outline: none;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #14171b; color: #e8e6de;
      font: 600 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .04em; z-index: 2;
    }
    #loader .logo { font-size: clamp(26px, 7vw, 46px); letter-spacing: .3em; color: #f2a33a; margin-bottom: 24px; text-shadow: 0 4px 0 #965c18; }
    #loader .bar { width: min(360px, 70vw); height: 10px; background: #0e1013; border: 2px solid #404750; }
    #loader .fill { height: 100%; width: 0; background: linear-gradient(90deg, #f2a33a, #ffd27a); transition: width .15s; }
  </style>
  <!-- poki include end -->
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <!-- poki include body -->
  <div id="loader">
    <div class="logo">GENESIS</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <script>
    // Площадка для моста Unity (Plugins/WebGL/Poki.jslib): реклама и события — через PokiSDK
    window.GenesisPortal = 'poki';

    function sendToUnity(method, arg) {
      if (window.unityInstance) window.unityInstance.SendMessage('Genesis', method, arg === undefined ? '' : arg);
    }

    var canvas = document.getElementById('unity-canvas');
    // Клавиши игры и колесо не прокручивают страницу Poki (требование «Prevent viewport scrolling»)
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) {
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'PageUp', 'PageDown', 'Home', 'End'].indexOf(e.key) >= 0) e.preventDefault();
    }, { passive: false });
    window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
    window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('pointerdown', function () { canvas.focus(); window.focus(); });

    // Вкладку скрыли — сохраняем мир (прогресс не теряется)
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') sendToUnity('OnPageHidden');
    });
    window.addEventListener('pagehide', function () { sendToUnity('OnPageHidden'); });

    function fitCanvas() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();
  </script>
  <!-- poki include end -->

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) {
        // Технические сообщения Unity — только в консоль
        if (type === 'error') console.error(msg); else console.warn(msg);
      }
    };

    var script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var fill = document.getElementById('fill');
        if (fill) fill.style.width = Math.round(progress * 100) + '%';
      }).then(function (instance) {
        window.unityInstance = instance;
        var loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
        canvas.focus();
      }).catch(function (message) {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
